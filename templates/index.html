<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>全民打工 · 放置点击</title>
  <link rel="icon" type="image/avif" href="/static/favicon.avif?v={{.AssetVersion}}" />
  <link rel="stylesheet" href="/static/css/style.css?v={{.AssetVersion}}" />
  <script defer src="https://um.krjojo.com/script.js" data-website-id="f5ce9a43-451b-4958-8266-38e9e5b62fb2"></script>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="logo">💼</span>
        <div>
          <div class="title">全民打工</div>
          <div class="sub">全员共享 · 一起搬砖</div>
        </div>
      </div>
      <div class="stats">
        <div class="stat gold">
          <span class="ico">🪙</span>
          <div>
            <div class="label">金币</div>
            <div class="val" id="gold">0</div>
          </div>
        </div>
        <div class="stat cps">
          <span class="ico">⚡</span>
          <div>
            <div class="label">每秒</div>
            <div class="val" id="cps">0/s</div>
          </div>
        </div>
        <div class="stat dia">
          <span class="ico">💎</span>
          <div>
            <div class="label">钻石</div>
            <div class="val" id="diamonds">0</div>
          </div>
        </div>
      </div>
      <div class="meta">
        <span id="online">在线 0</span>
        <span id="me" class="me">连接中…</span>
      </div>
    </header>

    <main class="layout">
      <section class="center">
        <div class="click-stage" id="stage">
          <button type="button" class="big-btn" id="clickBtn" aria-label="点击赚钱">
            <span class="coin-core">🪙</span>
            <span class="btn-hint">点击打工</span>
            <span class="power-tag" id="clickPower">+1</span>
          </button>
        </div>
        <div class="toast-area" id="toasts"></div>
      </section>

      <aside class="side upgrades">
        <div class="facility-heading">
          <h2>升级 / 设施</h2>
          <nav class="facility-pager" aria-label="设施分页">
            <button type="button" id="facilityPrev" title="上一页" aria-label="上一页">‹</button>
            <span id="facilityPageLabel">1 / 1</span>
            <button type="button" id="facilityNext" title="下一页" aria-label="下一页">›</button>
          </nav>
        </div>
        <div class="card click-up" id="clickUpgrade">
          <div class="row">
            <span class="ico">👆</span>
            <div class="info">
              <div class="name">点击收益升级</div>
              <div class="desc">每级点击收益 ×1.05</div>
            </div>
            <button type="button" class="buy-btn" id="upgradeClickBtn">升级</button>
          </div>
          <div class="meta-line">
            <span id="clickLv">Lv.0</span>
            <span id="clickCost">🪙 10</span>
          </div>
        </div>
        <div class="facility-list" id="facilityList"></div>
      </aside>

      <aside class="side chat-panel">
        <h2>工位聊天 / 动态</h2>
        <div class="chat-log" id="chatLog"></div>
        <form class="chat-form" id="chatForm">
          <input type="text" id="chatInput" maxlength="100" placeholder="说点什么…" autocomplete="off" />
          <button type="submit">发送</button>
        </form>
      </aside>
    </main>
    <footer class="site-footer">
      <a href="https://github.com/miniwater/click" target="_blank" rel="noopener noreferrer">
        <span aria-hidden="true">Github</span> miniwater/click
      </a>
    </footer>
  </div>
  <script src="/static/js/app.js?v={{.AssetVersion}}"></script>
</body>
</html>
